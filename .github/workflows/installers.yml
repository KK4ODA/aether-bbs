name: Installers

# Builds the Windows installer, the macOS disk image and the Linux archive with
# PyInstaller, and starts each built app once (--self-test) to catch modules
# PyInstaller left out.  The Release workflow calls this with the release's
# tag and attaches the files to it; on a pull request that touches packaging
# the files are kept as workflow artifacts to try out.

on:
  workflow_call:
    inputs:
      tag:
        description: Release to attach the installers to
        type: string
        required: true
      sha:
        description: Commit to build
        type: string
        required: true
  workflow_dispatch:
  pull_request:
    paths:
      - packaging/**
      - main.py
      - core/paths.py
      - core/updater.py
      - core/version.py
      - requirements.txt
      - .github/workflows/installers.yml

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, kind: windows }
          - { name: macOS,   os: macos-latest,   kind: macos }
          # the oldest supported Ubuntu, so the build runs on older distributions too
          - { name: Linux,   os: ubuntu-22.04,   kind: linux }
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Qt runtime libraries (Linux)
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0 espeak-ng

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3 pillow

      - name: Version
        run: echo "APP_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Build app
        run: pyinstaller packaging/aether_bbs.spec --noconfirm

      - name: Self-test the built app
        run: |
          case "${{ matrix.kind }}" in
            windows) dist/AetherBBS/AetherBBS.exe --self-test ;;
            macos)   "dist/Aether BBS.app/Contents/MacOS/AetherBBS" --self-test ;;
            linux)   dist/AetherBBS/AetherBBS --self-test ;;
          esac

      - name: Package (Windows installer)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('packaging/aether-bbs.png').save('aether-bbs.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          New-Item -ItemType Directory -Force out | Out-Null
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$PWD\dist\AetherBBS" `
            "/DOutputDir=$PWD\out" "/DIconFile=$PWD\aether-bbs.ico" `
            "/DLicenseFile=$PWD\LICENSE" packaging\windows\aether-bbs.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (macOS disk image)
        if: matrix.kind == 'macos'
        run: |
          mkdir -p out dmg
          cp -R "dist/Aether BBS.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Aether BBS" -srcfolder dmg -ov -format UDZO \
            "out/AetherBBS-${APP_VERSION}-macos.dmg"

      - name: Package (Linux archive)
        if: matrix.kind == 'linux'
        run: |
          mkdir -p out
          cp packaging/linux/install-desktop-entry.sh dist/AetherBBS/
          python -c "from PIL import Image; Image.open('packaging/aether-bbs.png').resize((256,256)).save('dist/AetherBBS/aether-bbs.png')"
          tar czf "out/AetherBBS-${APP_VERSION}-linux-x86_64.tar.gz" -C dist AetherBBS

      - uses: actions/upload-artifact@v4
        with:
          name: AetherBBS-${{ matrix.kind }}
          path: out/*
          if-no-files-found: error

      - name: Attach to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" out/* --clobber --repo "$GITHUB_REPOSITORY"
